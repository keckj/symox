[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "symox"
description = "Fast symbolic mathematics in Rust with a SymPy compatible Python API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["numpy>=1.21", "mpmath>=1.3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

[project.optional-dependencies]
sympy = ["sympy>=1.12"]
test = ["pytest", "sympy==1.14.0", "matplotlib>=3.5", "meson>=1.2", "ninja"]
plotting = ["matplotlib>=3.5"]
torch = ["torch>=2.2"]
jax = ["jax>=0.4.30"]
slang = ["slangpy>=0.43.1"]
extra = ["torch>=2.2", "jax>=0.4.30", "slangpy>=0.43.1"]
test-extra = ["pytest", "sympy==1.14.0", "matplotlib>=3.5", "meson>=1.2", "ninja", "torch>=2.2", "jax>=0.4.30", "slangpy>=0.43.1"]

[tool.maturin]
include = [{ path = "LICENSE-*", format = "sdist" }]
manifest-path = "crates/symox-py/Cargo.toml"
python-source = "python"
module-name = "symox._core"
features = ["pyo3/extension-module"]
