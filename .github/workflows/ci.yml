name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test -p symox
      - run: cargo clippy -p symox -- -D warnings -A clippy::all -W clippy::correctness

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest sympy==1.14.0 numpy matplotlib meson ninja
          maturin build --release -o dist
          pip install --no-index --find-links dist symox
      - name: Tests
        run: python -m pytest -q tests --ignore=tests/extra

  pytorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build with optional PyTorch backend
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest sympy==1.14.0 numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          maturin build --release -o dist
          pip install --no-index --find-links dist symox
      - name: Tensor execution, autograd and compilation
        run: >-
          python -m pytest -q
          tests/extra/test_pytorch_codegen.py
          tests/extra/test_matrix_log_torch.py
          tests/extra/test_complex_parts_codegen.py
          tests/extra/test_cuda_lifecycle.py
          tests/extra/test_cuda_runtime.py
          tests/extra/test_cuda_torch_interop.py
          tests/extra/test_matrix_function_codegen.py
          -k "not jax"

  jax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build with optional JAX backend
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest sympy==1.14.0 numpy jax
          maturin build --release -o dist
          pip install --no-index --find-links dist symox
      - name: Array execution, differentiation and compilation
        run: >-
          python -m pytest -q
          tests/extra/test_jax_codegen.py
          tests/extra/test_matrix_log_jax.py
          tests/extra/test_complex_parts_codegen.py
          tests/extra/test_matrix_function_codegen.py
          -k "not torch"

  slang:
    runs-on: ubuntu-latest
    env:
      SYMOX_SLANG_TEST_BACKENDS: vulkan
      SYMOX_SLANG_REQUIRE_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Build with optional Slang backend
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest sympy==1.14.0 numpy 'slangpy>=0.43.1'
          maturin build --release -o dist
          pip install --no-index --find-links dist symox
      - name: Compile and execute through Vulkan
        run: python -m pytest -q tests/extra/test_slang_codegen.py

  sycl:
    runs-on: ubuntu-latest
    env:
      SYMOX_ACPP: ${{ runner.temp }}/symox-acpp/bin/acpp
      SYMOX_ACPP_REQUIRE_RUNTIME: "1"
      SYMOX_ACPP_TARGETS: omp
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install AdaptiveCpp CPU build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev libnuma-dev
      - uses: actions/cache@v4
        id: acpp
        with:
          path: ${{ runner.temp }}/symox-acpp
          key: acpp-omp-${{ runner.os }}-31db2e83903c1db9f50b03b620eb0a09224cd0eb-v1
      - name: Build pinned AdaptiveCpp CPU SDK
        if: steps.acpp.outputs.cache-hit != 'true'
        run: |
          python tools/install_adaptivecpp.py --prefix "$RUNNER_TEMP/symox-acpp" --jobs 2
      - name: Build symox
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest sympy==1.14.0 numpy
          maturin build --release -o dist
          pip install --no-index --find-links dist symox
      - name: Compile and execute generated SYCL
        run: python -m pytest -q tests/extra/test_sycl_codegen.py
