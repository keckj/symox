[workspace]
resolver = "2"
members = ["crates/symox-core", "crates/symox-py"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/keckj/symox"
authors = ["keckj"]

[workspace.dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
num-rational = "0.4"
num-complex = "0.4"
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
